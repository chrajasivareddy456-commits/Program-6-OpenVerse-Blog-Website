<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Stories — OpenVerse</title>
<meta name="description" content="Search and explore stories across every category on OpenVerse.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><path d=%22M20 2 L36 11 V29 L20 38 L4 29 V11 Z%22 fill=%22%238b5cf6%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/animations.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<div id="navbar-root"></div>

<section class="page-hero">
  <div class="hero-bg"></div>
  <div class="container" style="position:relative;z-index:1">
    <span class="section-eyebrow" style="justify-content:center;display:flex">🔎 Explore</span>
    <h1 id="exploreHeading">Explore Stories</h1>
    <p>Ideas, perspectives and stories worth your time.</p>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="search-bar">
      <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      <input type="text" id="exploreSearch" placeholder="Search stories, authors, tags..." autocomplete="off">
    </div>

    <div class="filters-row">
      <button class="chip" data-filter="all">All</button>
      <button class="chip" data-filter="trending">Trending</button>
      <button class="chip" data-filter="latest">Latest</button>
      <button class="chip" data-filter="popular">Popular</button>
      <button class="chip" data-filter="technology">Technology</button>
      <button class="chip" data-filter="ai">AI</button>
      <button class="chip" data-filter="programming">Programming</button>
      <button class="chip" data-filter="science">Science</button>
      <button class="chip" data-filter="lifestyle">Lifestyle</button>
      <button class="chip" data-filter="travel">Travel</button>
      <button class="chip" data-filter="business">Business</button>
      <button class="chip" data-filter="education">Education</button>
    </div>

    <div class="explore-toolbar">
      <span class="results-count" id="resultsCount"></span>
      <select class="sort-select" id="sortSelect" aria-label="Sort stories">
        <option value="latest">Latest</option>
        <option value="oldest">Oldest</option>
        <option value="popular">Most Popular</option>
        <option value="most-read">Most Read</option>
      </select>
    </div>

    <div class="post-grid stagger" id="exploreGrid">
      <div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>
    </div>

    <div class="load-more-wrap">
      <button class="btn btn-ghost" id="loadMoreBtn" style="display:none">Load More Stories</button>
    </div>
  </div>
</section>

<div id="footer-root"></div>

<script src="/js/main.js"></script>
<script src="/js/explore.js"></script>
</body>
</html>
