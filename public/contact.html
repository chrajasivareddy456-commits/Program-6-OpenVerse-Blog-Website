<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — OpenVerse</title>
<meta name="description" content="Get in touch with the OpenVerse team.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><path d=%22M20 2 L36 11 V29 L20 38 L4 29 V11 Z%22 fill=%22%238b5cf6%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/animations.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<div id="navbar-root"></div>

<section class="page-hero">
  <div class="hero-bg"></div>
  <div class="container" style="position:relative;z-index:1">
    <span class="section-eyebrow" style="justify-content:center;display:flex">✉️ Contact</span>
    <h1>Let's Talk</h1>
    <p>Questions, feedback, or a story idea you'd like to pitch? We'd love to hear from you.</p>
  </div>
</section>

<section class="section-tight">
  <div class="container" style="display:grid;grid-template-columns:1fr 1.3fr;gap:2.5rem;align-items:start;max-width:1080px">
    <div class="glass" style="padding:2rem">
      <h3 style="margin-bottom:1.4rem">Get in touch</h3>
      <div style="display:flex;flex-direction:column;gap:1.3rem">
        <div style="display:flex;gap:.9rem;align-items:flex-start">
          <div class="feature-icon" style="width:42px;height:42px;font-size:1.1rem;flex-shrink:0">📧</div>
          <div><div style="font-weight:600;font-size:.92rem">Email</div><div style="color:var(--text-muted);font-size:.88rem">hello@openverse.app</div></div>
        </div>
        <div style="display:flex;gap:.9rem;align-items:flex-start">
          <div class="feature-icon" style="width:42px;height:42px;font-size:1.1rem;flex-shrink:0">📍</div>
          <div><div style="font-weight:600;font-size:.92rem">Location</div><div style="color:var(--text-muted);font-size:.88rem">Remote-first, worldwide</div></div>
        </div>
        <div style="display:flex;gap:.9rem;align-items:flex-start">
          <div class="feature-icon" style="width:42px;height:42px;font-size:1.1rem;flex-shrink:0">💬</div>
          <div><div style="font-weight:600;font-size:.92rem">Response time</div><div style="color:var(--text-muted);font-size:.88rem">Usually within 2 business days</div></div>
        </div>
      </div>
      <hr class="divider">
      <div class="social-row">
        <a href="#" class="btn-icon" aria-label="Twitter">𝕏</a>
        <a href="#" class="btn-icon" aria-label="Instagram">◎</a>
        <a href="#" class="btn-icon" aria-label="LinkedIn">in</a>
      </div>
    </div>

    <form class="glass form-card" id="contactForm" style="padding:2rem" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="cName">Name *</label>
          <input type="text" id="cName" placeholder="Your name" required>
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label for="cEmail">Email *</label>
          <input type="email" id="cEmail" placeholder="you@example.com" required>
          <div class="form-error"></div>
        </div>
      </div>
      <div class="form-group">
        <label for="cSubject">Subject *</label>
        <input type="text" id="cSubject" placeholder="What's this about?" required>
        <div class="form-error"></div>
      </div>
      <div class="form-group">
        <label for="cMessage">Message *</label>
        <textarea id="cMessage" rows="6" placeholder="Tell us more..." required></textarea>
        <div class="form-error"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">Send Message</button>
      </div>
    </form>
  </div>
</section>

<div id="footer-root"></div>

<script src="/js/main.js"></script>
<script src="/js/contact.js"></script>
</body>
</html>
